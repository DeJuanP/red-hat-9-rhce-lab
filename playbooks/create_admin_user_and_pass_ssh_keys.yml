---
- name: Create admin user and pass ssh keys
  hosts: datacenter
  become: true

  tasks:
   - name: Create admin user
     ansible.builtin.user:
      name: automation
      state: present

   - name: Set authorized key taken from file
     ansible.posix.authorized_key:
      user: automation
      state: present
      key: "{{ lookup('file', '/home/ansible/.ssh/id_ed25519.pub') }}"
