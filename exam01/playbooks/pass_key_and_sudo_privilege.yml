---
- name: Pass ssh keys to managed nodes and create sudo privilege
  hosts: all
  become: true

  tasks:
   - name: Pass ssh keys
     ansible.posix.authorized_key:
      user: automation
      state: present
      key: "{{ lookup('file', '/home/ansible/.ssh/id_ed25519.pub') }}"

   - name: Give user sudo privilege
     ansible.builtin.copy:
      dest: /etc/sudoers.d/automation
      mode: '0644'
      content: |
       automation        ALL=(ALL)       NOPASSWD: ALL
      validate: /usr/sbin/visudo -csf %s
