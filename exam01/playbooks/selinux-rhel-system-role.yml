---
- name: Configure SELinux with RHEL system roles
  hosts: webservers
  become: true
  
  vars:
   selinux_policy: targeted
   selinux_state: enforcing
   selinux_booleans:
     - name: httpd_can_network_connect
     - state: true
     - persistent: true
  roles:
   - redhat.rhel_system_roles.selinux
