---
# tasks file for common

- name: Install httpd
  ansible.builtin.dnf:
   name: httpd
   state: present

- name: Start and enable httpd service
  ansible.builtin.service:
   name: httpd
   state: started
   enabled: yes

- name: Open ports for http and https
  ansible.posix.firewalld:
   service: "{{ item }}"
   state: enabled
   permanent: true
   immediate: true
  loop: "{{ services }}"

- name: Enabled firewalld
  ansible.builtin.service:
   name: firewalld
   enabled: yes
